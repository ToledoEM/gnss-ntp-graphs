[project]
name = "gnss-ntp-graphs"
version = "0.1.0"
description = "Static history graphs for GPS-disciplined NTP servers (chrony or ntpd, gpsd)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gnss-ntp-graphs = "gnss_ntp_graphs.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gnss_ntp_graphs*"]

[tool.setuptools.package-data]
gnss_ntp_graphs = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
