[project]
name = "gnss-ntp-graphs"
version = "0.1.0"
description = "Static history graphs for GPS-disciplined NTP servers (chrony or ntpd, gpsd)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gnss-ntp-graphs = "gnss_ntp_graphs.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
docs = ["zensical>=0.0.71"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gnss_ntp_graphs*"]

[tool.setuptools.package-data]
gnss_ntp_graphs = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "B", "UP", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts, fake values, 0.0.0.0 bind cases, subprocess fixtures.
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S311", "S603", "S607", "S608"]
# Table and column names come from module constants; values are bound parameters.
"gnss_ntp_graphs/store.py" = ["S608"]

[tool.coverage.run]
branch = true
source = ["gnss_ntp_graphs"]

[tool.coverage.report]
skip_covered = true
fail_under = 90
