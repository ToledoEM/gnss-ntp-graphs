# Serve the graphs at http://<host>/graphs/ next to the bridge's JSON files.
# Install: cp to /etc/lighttpd/conf-available/89-gnss-ntp-graphs.conf
#          lighty-enable-mod gnss-ntp-graphs && systemctl reload lighttpd
# Debian's lighttpd.conf already loads mod_alias
server.modules += ( "mod_setenv" )

alias.url += ( "/graphs/" => "/var/lib/gnss-ntp-graphs/www/" )

$HTTP["url"] =~ "^/graphs/data/" {
    setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}
