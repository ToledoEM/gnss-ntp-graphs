[project]
site_name = "GNSS NTP Graphs"
site_description = "History graphs for a GPS-disciplined NTP server"
site_url = "https://toledoem.github.io/gnss-ntp-graphs/"
docs_dir = "docs"
site_dir = "site"
copyright = 'Docs made with <a href="https://zensical.org">Zensical</a> · GNSS NTP Graphs developed by ToledoEM · Apache License 2.0'
repo_url = "https://github.com/ToledoEM/gnss-ntp-graphs"
repo_name = "ToledoEM/gnss-ntp-graphs"

nav = [
  { "Home" = "index.md" },
  { "Install" = [
    "install/index.md",
    { "Raspberry Pi or Debian" = "install/raspberry-pi.md" },
    { "Docker" = "install/docker.md" },
    { "Web server" = "install/web-server.md" },
  ] },
  { "Configuration" = [
    "configuration/index.md",
    { "Collector" = "configuration/collector.md" },
    { "Web page" = "configuration/web-page.md" },
    { "Daemon logs" = "configuration/daemon-logs.md" },
  ] },
  { "Reading the graphs" = [
    "readouts/index.md",
    { "NTP" = "readouts/ntp.md" },
    { "Peers" = "readouts/peers.md" },
    { "GNSS" = "readouts/gnss.md" },
    { "Stats" = "readouts/stats.md" },
  ] },
  { "Reference" = [
    { "How it works" = "reference/architecture.md" },
    { "Data files" = "reference/data-files.md" },
    { "Command line" = "reference/cli.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Development" = "development.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
